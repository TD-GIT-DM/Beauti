<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070707" />
    <meta
      name="description"
      content="Beauti. Beauty deals, promo codes, and restock alerts."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var FONTS = {
          classic: ['"Outfit", system-ui, sans-serif', '"Cormorant Garamond", "Times New Roman", serif', ""],
          quicksand: ['"Quicksand", "Outfit", system-ui, sans-serif', '"Quicksand", "Outfit", system-ui, sans-serif', "Quicksand:wght@400;500;600;700"],
          comfortaa: ['"Comfortaa", "Outfit", system-ui, sans-serif', '"Comfortaa", "Outfit", system-ui, sans-serif', "Comfortaa:wght@400;500;600;700"],
          fredoka: ['"Nunito", "Outfit", system-ui, sans-serif', '"Fredoka", "Nunito", system-ui, sans-serif', "Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700"],
          baloo: ['"Nunito", "Outfit", system-ui, sans-serif', '"Baloo 2", "Nunito", system-ui, sans-serif', "Baloo+2:wght@500;600;700&family=Nunito:wght@400;500;600;700"],
          pacifico: ['"Quicksand", "Outfit", system-ui, sans-serif', '"Pacifico", "Quicksand", cursive', "Pacifico&family=Quicksand:wght@400;500;600;700"],
          dancing: ['"Outfit", system-ui, sans-serif', '"Dancing Script", "Outfit", cursive', "Dancing+Script:wght@500;600;700"]
        };
        var PRESET = { pink: "#5a2348", teal: "#0f4c50" };
        function isHex(value) {
          return typeof value === "string" && /^#[0-9a-fA-F]{6}$/.test(value);
        }
        function isLight(hex) {
          var n = hex.slice(1);
          var r = parseInt(n.slice(0, 2), 16);
          var g = parseInt(n.slice(2, 4), 16);
          var b = parseInt(n.slice(4, 6), 16);
          return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255 > 0.62;
        }
        try {
          var raw = localStorage.getItem("beauti_theme");
          var theme = raw ? JSON.parse(raw) : {};
          var bg = theme.background === "pink" || theme.background === "teal" ? theme.background : "black";
          var font = Object.prototype.hasOwnProperty.call(FONTS, theme.font) ? theme.font : "classic";
          var face = FONTS[font];
          var root = document.documentElement;
          var canvas = bg === "black" ? (isHex(theme.secondary) ? theme.secondary : "#070707") : PRESET[bg];
          root.setAttribute("data-bg", bg);
          root.setAttribute("data-font", font);
          root.style.backgroundColor = canvas;
          root.style.color = isLight(canvas) ? "#1a1610" : "#f4efe6";
          root.style.setProperty("--font-sans", face[0]);
          root.style.setProperty("--font-serif", face[1]);
          if (face[2]) {
            var link = document.createElement("link");
            link.id = "beauti-font-active";
            link.rel = "stylesheet";
            link.crossOrigin = "anonymous";
            link.href = "https://fonts.googleapis.com/css2?family=" + face[2] + "&display=swap";
            document.head.appendChild(link);
          }
        } catch (e) {}
      })();
    </script>
    <title>Beauti</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
