# Beauti — Cloudflare Workers + static assets (SPA) + D1 + KV + Cron
name = "beauti"
main = "worker/index.ts"
compatibility_date = "2026-09-10"
compatibility_flags = ["nodejs_compat"]

[assets]
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[[d1_databases]]
binding = "DB"
database_name = "beauti"
database_id = "f83c9aae-86c4-457a-882a-fd86d1fb85bb"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "DEALS_CACHE"
id = "80ead3ba6f2b4678956c3cac9c8bebc8"

# Two schedules so each invocation stays under the Workers free-plan cap of 50
# external subrequests (redirects count). The handler reads event.cron.
# Pre-orders: */15 (their own budget, before the catalog pass).
# Catalog: 8,23,38,53 (rotating batch on the remaining headroom of a fresh budget).
[triggers]
crons = ["*/15 * * * *", "8,23,38,53 * * * *"]

[vars]
APP_NAME = "Beauti"

# Workers AI: catalog-grounded product advisor (no third-party API key).
# Production deploy uses this binding. Local Vite sets remoteBindings: false
# so `npm run dev` does not hang on OAuth; catalog ranking still answers.
[ai]
binding = "AI"
